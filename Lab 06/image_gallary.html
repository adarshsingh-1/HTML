<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>

    h2{
      text-align: center;
    }
    .photo
    {
      width:20%;
    }
    .photo img{
      width:200px;
      height: fit-content;
      background-color:gray;
      border:2px solid goldenrod;
      border-radius: 5px;
    }
    .photo img:hover
    {
      transform: scale(1.05);
    }
    .gallery
    {
      display:flex;
      gap:30px;
      flex-wrap: wrap;
      justify-content: center;

    }
    @media (max-width:700px) {
        .photo
        {
          width: 40%;
        }
    }
    @media (max-width:400px) {
        .photo
        {
          width: 80%;
        }
    }
  </style>
</head>
<body>
  <h2>Photo Gallery</h2>
  <div class="gallery">

        <div class="photo"><img src="File/Butterfly.png" alt="Photo 1"></div>
        <div class="photo"><img src="File/daylight-environment-forest-459225.jpg" alt="Photo 2"></div>
        <div class="photo"><img src="File/images.jpg" alt="Photo 3"></div>
        <div class="photo"><img src="File/Deer.jpg" alt="Photo 4"></div>
        <div class="photo"><img src="File/Landscape.jpg" alt="Photo 5"></div>
        <div class="photo"><img src="File/Leopard.jpg" alt="Photo 6"></div>
        <div class="photo"><img src="File/River.jpg" alt="Photo 7"></div>
        <div class="photo"><img src="File/Wildlife.jpg" alt="Photo 8"></div>

    </div>
</body>
</html>
